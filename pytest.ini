[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -v -p no:anyio --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests
    rag: RAG retrieval & generation tests
    security: Security and SSRF validation tests
